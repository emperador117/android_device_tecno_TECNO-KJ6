name: KJ6 Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'boot'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})"
        echo "Path: ${{ github.event.inputs.DEVICE_PATH }} | Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile: ${{ github.event.inputs.MAKEFILE_NAME }} | Target: ${{ github.event.inputs.BUILD_TARGET }}image"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup (free disk)
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev lz4 libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 tree libncurses-dev openjdk-8-jdk || true

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "builder"
        git config --global user.email "builder@example.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: repo sync -j$(nproc --all) --force-sync || repo sync -j4 --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Patch BoardConfig (recovery-as-boot vs vendor_boot)
      run: |
        BC="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
        if [ -f "$BC" ]; then
          sed -i 's/^BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true/# & (quitado: choca con RECOVERY_AS_BOOT)/' "$BC"
          # el arbol referencia TARGET_FORCE_PREBUILT_KERNEL pero nunca lo asigna -> forzarlo a true
          if ! grep -qE '^[[:space:]]*TARGET_FORCE_PREBUILT_KERNEL[[:space:]]*:=[[:space:]]*true' "$BC"; then
            sed -i '/ifeq.*TARGET_FORCE_PREBUILT_KERNEL.*true/i TARGET_FORCE_PREBUILT_KERNEL := true' "$BC"
          fi
          echo "--- BoardConfig tras patch ---"
          grep -nE "RECOVERY_AS_BOOT|INCLUDE_RECOVERY|MOVE_RECOVERY|FORCE_PREBUILT_KERNEL|PREBUILT_KERNEL :=" "$BC" || true
        else
          echo "no existe $BC (nada que parchear)"
        fi

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload image (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_TARGET }}-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor_boot*.img
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
